<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101b24"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="拾题个人离线错题本：拍照录题、四科归档、知识笔记与本机备份。">
  <title>拾题 · 随身错题本</title>
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar"><a class="brand" href="#home"><span class="brand-mark">拾</span><span>拾题<small>随身错题本</small></span></a><p class="sidebar-caption">把进步，留在每一次回顾里。</p><nav aria-label="主要导航"><a href="#home">⌂ <span>学习首页</span></a><a href="#questions">▤ <span>我的错题</span></a><a href="#scan">▣ <span>拍照录题</span></a><a href="#materials">▱ <span>本机资料</span></a><a href="#settings">⚙ <span>安装与备份</span></a></nav><div class="local-note"><span class="status-dot"></span> 只存在这台设备<p>无需账号 · 不上传学习内容</p></div></aside>
    <main id="main"><header class="topbar"><div class="mobile-brand">拾题 <span>OFFLINE NOTEBOOK</span></div><span id="offline-state" class="status-pill" role="status">正在准备离线内容…</span><a class="button primary compact" href="#scan">＋ 拍照录题</a></header><div id="notice" role="status" hidden></div><div id="page" tabindex="-1"></div></main>
  </div>
  <nav class="bottom-nav" aria-label="手机导航"><a href="#home">⌂<span>首页</span></a><a href="#questions">▤<span>错题</span></a><a href="#scan" class="scan-nav">＋<span>录题</span></a><a href="#materials">▱<span>资料</span></a><a href="#settings">⚙<span>我的</span></a></nav>
  <dialog id="editor" aria-labelledby="editor-title"><form id="question-form"><div class="dialog-head"><div><span class="eyebrow">CAPTURE YOUR PROGRESS</span><h2 id="editor-title">留住这道题</h2></div><button type="button" class="icon-button" data-close aria-label="关闭录题">×</button></div><div class="editor-grid"><section><div class="photo-intro"><span class="photo-symbol">▣</span><h3>从一张照片开始</h3><p>原图保存在本机，随时对照复习。</p><div class="actions"><button type="button" class="primary" id="take-photo">拍照录题</button><button type="button" id="pick-photo">从相册选择</button></div><input id="camera-input" type="file" accept="image/*" capture="environment" hidden><input id="photo-input" type="file" accept="image/*" multiple hidden><small>每题最多 6 张，每张最多 5 MB；不支持的照片格式请转为 JPG。</small></div><div id="photo-list" class="photo-list"></div><div id="ocr-box"><p id="ocr-status" role="status"></p><button id="cancel-ocr" type="button" hidden>停止识别</button><div id="ocr-result" hidden><label>识别结果，可先校对<textarea id="ocr-text" rows="5" maxlength="20000"></textarea></label><div class="actions"><button type="button" id="apply-ocr">追加到题目</button><button type="button" id="apply-subject" hidden></button></div></div></div></section><section class="fields"><label>题目标题<input name="title" required maxlength="120" placeholder="例如：二重积分的积分次序"></label><div class="field-row"><label>科目<select name="subject"></select></label><label>章节 / 模块<input name="chapter" maxlength="100" list="modules" placeholder="选择或填写章节"><datalist id="modules"><option>数据结构</option><option>计算机组成原理</option><option>操作系统</option><option>计算机网络</option></datalist></label></div><label>题目内容<textarea name="content" rows="5" maxlength="20000" placeholder="可输入题目，也可以只保留照片"></textarea></label><label>答案与错因<textarea name="answer" rows="4" maxlength="20000" placeholder="哪里想错了？下次怎样避免？"></textarea></label><label>知识点 / 复习笔记<textarea name="notes" rows="3" maxlength="20000" placeholder="把这道题与你学过的知识联系起来"></textarea></label><label>讲解视频或参考链接<textarea name="links" rows="2" maxlength="5000" placeholder="每行一个 https:// 链接，打开时需要联网"></textarea></label><label class="check"><input name="mastered" type="checkbox"> 这道题我已掌握</label></section></div><p id="editor-error" class="error" role="alert"></p><footer class="dialog-actions"><button type="button" data-close>取消</button><button class="primary" id="save-question" type="submit">保存到错题本</button></footer></form></dialog>
  <dialog id="detail" aria-labelledby="detail-title"></dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="actions"><button id="confirm-no">取消</button><button id="confirm-yes" class="primary">确认</button></div></dialog>
  <input type="file" id="backup-input" accept=".json,application/json" hidden><input type="file" id="material-input" accept=".pdf,.pptx,.docx,.jpg,.jpeg,.png" hidden>
  <noscript>请启用浏览器 JavaScript 后使用离线错题本。</noscript><script type="module" src="./app.js"></script>
</body></html>
